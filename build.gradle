plugins { id 'java-library'; id 'net.neoforged.moddev' version '2.0.140' }
version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories { maven { name = 'C4 Maven'; url = 'https://maven.theillusivec4.top/' } }
dependencies { compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}:api"; runtimeOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}" }
neoForge { version = project.neo_version; runs { client { client(); gameDirectory = project.file('run') }; server { server(); gameDirectory = project.file('run-server') } }; mods { "${mod_id}" { sourceSet sourceSets.main } } }
sourceSets.main.resources { srcDir 'src/generated/resources' }
def correctedItemTextures = [
 ancient_talon:'',
 storm_crystal:'',
 eye_of_the_summit:'',
 golden_eagle_harness:'',
 eagle_feather:'',
 talon_blade:'',
 talonspire:'',
 talonteer:'',
 gold_chain:'',
 iron_chain:'',
 netherite_chain:'',
 troll_heart:'',
 crushed_talon:'',
 talon_dust:'iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAAiklEQVR4nO2VyxGAIAxEg7VQCRVZChVZib3oyRkPks+C6GHfiXEY9hkTFCGEEPIxacQh+7Ye1zqXGjoztPkp6P4MkViQ8FYwgtsUDbSq4a4AiiXuFrDeJJeaog0oMuETiOjypkBvs3X1wNvhqsCoMYMFZtEt0CqzdyLUTZFrFv0fhKYAmXNCyO85Ae59OQ0Gw5MVAAAAAElFTkSuQmCC'
]
tasks.register('generateCorrectedItemTextures') { outputs.dir layout.projectDirectory.dir('src/generated/resources/assets/peaksandtalons/textures/item'); doLast { def outDir=file('src/generated/resources/assets/peaksandtalons/textures/item'); outDir.mkdirs(); correctedItemTextures.each { name,data -> new File(outDir,"${name}.png").bytes=data.decodeBase64() } } }
tasks.named('processResources', ProcessResources).configure { dependsOn tasks.named('generateCorrectedItemTextures'); duplicatesStrategy=DuplicatesStrategy.EXCLUDE; var replaceProperties=[minecraft_version_range:minecraft_version_range,neo_version:neo_version,loader_version_range:loader_version_range,mod_id:mod_id,mod_name:mod_name,mod_license:mod_license,mod_version:mod_version]; inputs.properties replaceProperties; filesMatching('META-INF/neoforge.mods.toml'){ expand replaceProperties } }
