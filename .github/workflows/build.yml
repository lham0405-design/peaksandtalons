name: Build

on:
  push:
    branches: [ main, playable-alpha, full-eagle-build, ftb-progression ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Generate packaged visual assets
        shell: bash
        run: |
          mkdir -p src/main/resources/assets/peaksandtalons/textures/entity
          echo '' | base64 -d > src/main/resources/assets/peaksandtalons/textures/entity/eagle.png
          python3 scripts/generate_visual_assets.py
      - name: Build mod
        run: gradle build --stacktrace
      - name: Verify progression and visual content
        shell: bash
        run: |
          set -euo pipefail
          test -f config/ftbquests/quests/data.snbt
          test -f config/ftbquests/quests/chapter_groups.snbt
          test -f config/ftbquests/quests/lang/en_us.snbt
          for chapter in B100000000000001 B100000000000002 B100000000000003 B100000000000004 B200000000000001; do test -f "config/ftbquests/quests/chapters/${chapter}.snbt"; done
          grep -q 'dependencies:\["C100000000000002"\]' config/ftbquests/quests/chapters/B100000000000001.snbt
          grep -q 'C100000000000003","C100000000000004","C100000000000005","C100000000000006' config/ftbquests/quests/chapters/B100000000000001.snbt
          grep -q 'max_completable_dependents:1' config/ftbquests/quests/chapters/B100000000000002.snbt
          grep -q 'peaksandtalons:heart_of_orduk' config/ftbquests/quests/chapters/B100000000000004.snbt
          grep -q 'explorerscompass:explorerscompass' config/ftbquests/quests/chapters/B100000000000004.snbt
          test -f src/main/resources/data/peaksandtalons/worldgen/structure/orduks_cave.json
          test -f src/main/resources/data/peaksandtalons/worldgen/structure_set/orduks_cave.json
          test -f src/main/resources/data/peaksandtalons/worldgen/template_pool/orduks_cave/start.json
          grep -q 'explorerscompass:explorerscompass' src/main/java/com/leigh/peaksandtalons/block/OrdukOfferingPodiumBlock.java
          JAR=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*sources*' ! -name '*javadoc*' | head -n 1)
          test -n "$JAR"
          jar tf "$JAR" | grep -q 'assets/peaksandtalons/textures/entity/eagle.png'
          for item in talonteer talonspire iron_chain gold_chain netherite_chain heart_of_orduk; do
            jar tf "$JAR" | grep -q "assets/peaksandtalons/models/item/${item}.json"
            jar tf "$JAR" | grep -q "assets/peaksandtalons/textures/item/${item}.png"
          done
          jar tf "$JAR" | grep -q 'data/peaksandtalons/recipe/talonspire.json'
          jar tf "$JAR" | grep -q 'data/peaksandtalons/recipe/talonteer.json'
      - name: Assemble modpack overlay
        shell: bash
        run: |
          set -euo pipefail
          rm -rf playtest
          mkdir -p playtest/mods playtest/config
          JAR=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*sources*' ! -name '*javadoc*' | head -n 1)
          cp "$JAR" playtest/mods/
          cp -R config/ftbquests playtest/config/
          cat > playtest/INSTALL.txt <<'EOF'
          PEAKS & TALONS PROGRESSION PLAYTEST
          Extract this ZIP into the ROOT of the Minecraft/CurseForge instance, merging mods/ and config/.
          Keep FTB Quests, FTB Library and FTB Teams installed. Create 6.0.10 is part of the intended progression environment.
          Test in fresh/unexplored chunks for Orduk cave worldgen changes.
          EOF
      - name: Upload progression playtest
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: peaksandtalons-progression-playtest
          path: playtest/
