name: Build

on:
  push:
    branches: [ main, playable-alpha, full-eagle-build, ftb-progression ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Generate packaged Eagle texture
        shell: bash
        run: |
          mkdir -p src/main/resources/assets/peaksandtalons/textures/entity
          echo '' | base64 -d > src/main/resources/assets/peaksandtalons/textures/entity/eagle.png
      - name: Build mod
        run: gradle build --stacktrace
      - name: Verify progression and visual content
        shell: bash
        run: |
          set -euo pipefail
          test -f config/ftbquests/quests/data.snbt
          test -f config/ftbquests/quests/chapter_groups.snbt
          test -f config/ftbquests/quests/lang/en_us.snbt
          for chapter in B100000000000001 B100000000000002 B100000000000003 B100000000000004; do
            test -f "config/ftbquests/quests/chapters/${chapter}.snbt"
          done
          grep -q 'max_completable_dependents:1' config/ftbquests/quests/chapters/B100000000000002.snbt
          grep -q 'peaksandtalons:eagle/hunter_path' config/ftbquests/quests/chapters/B100000000000002.snbt
          grep -q 'peaksandtalons:eagle/bond_path' config/ftbquests/quests/chapters/B100000000000002.snbt
          JAR=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*sources*' ! -name '*javadoc*' | head -n 1)
          test -n "$JAR"
          jar tf "$JAR" | grep -q 'assets/peaksandtalons/textures/entity/eagle.png'
          for item in storm_crystal ancient_talon eye_of_the_summit golden_eagle_harness; do
            jar tf "$JAR" | grep -q "assets/peaksandtalons/items/${item}.json\|assets/peaksandtalons/models/item/${item}.json"
          done
      - name: Assemble modpack overlay
        shell: bash
        run: |
          set -euo pipefail
          rm -rf playtest
          mkdir -p playtest/mods playtest/config
          JAR=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*sources*' ! -name '*javadoc*' | head -n 1)
          cp "$JAR" playtest/mods/
          cp -R config/ftbquests playtest/config/
          cat > playtest/INSTALL.txt <<'EOF'
          PEAKS & TALONS PROGRESSION PLAYTEST

          1. Completely close Minecraft.
          2. Remove the older Peaks & Talons JAR from your instance mods folder.
          3. Copy the contents of this ZIP into the ROOT of the Minecraft/CurseForge instance.
             The mods folder merges with mods and config merges with config.
          4. Keep FTB Quests, FTB Library and FTB Teams installed.
          5. Iris/Sodium, shaders and Jade are compatible-target utility/visual mods and are not required by Peaks & Talons progression.
          6. Launch the game and open FTB Quests.

          IMPORTANT: Do not place this entire ZIP inside the mods folder. The config/ftbquests files
          must be installed at the instance root so FTB Quests can load the quest chapters.
          EOF
      - name: Upload progression playtest
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: peaksandtalons-progression-playtest
          path: playtest/
