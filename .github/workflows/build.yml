name: Build

on:
  push:
    branches: [ main, playable-alpha, full-eagle-build, ftb-progression ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Generate packaged Eagle texture
        shell: bash
        run: |
          mkdir -p src/main/resources/assets/peaksandtalons/textures/entity
          echo '' | base64 -d > src/main/resources/assets/peaksandtalons/textures/entity/eagle.png
      - name: Build mod
        run: gradle build --stacktrace
      - name: Verify Eagle texture packaged
        run: jar tf build/libs/*.jar | grep 'assets/peaksandtalons/textures/entity/eagle.png'
      - name: Upload progression playtest
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: peaksandtalons-progression-playtest
          path: build/libs/*.jar
